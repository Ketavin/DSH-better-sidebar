name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded PR run (it is on a stale commit); never cancel a
# push run — it is already producing the post-merge signal. The mount job
# boots a real DSH + Chromium, so the savings matter there most.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-runtime:
    name: windows · ConPTY runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate packaged ConPTY cleanup seam
        timeout-minutes: 5
        # Keep Windows native-runtime files isolated and serialized. A single
        # threads worker avoids Vitest fork IPC teardown races without
        # weakening the assertions against the packaged node-pty runtime.
        run: pnpm exec vitest run --pool=threads --maxWorkers=1 --no-file-parallelism tests/node-pty-attachconsole.spec.ts
      - name: Exercise real ConPTY lifecycle
        timeout-minutes: 5
        # These assertions launch real native PTYs; serial execution makes a
        # leaked handle fail this named step instead of hanging the whole job.
        run: pnpm exec vitest run --pool=threads --maxWorkers=1 --no-file-parallelism tests/agent-pty.spec.ts
      - name: Build Windows package
        run: pnpm build

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Tests run git log against this repository and need the full history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The plugin's git revert/cherry-pick spawn git without setting an
      # identity (deliberate, see tests/smoke.spec.ts) and rely on ambient
      # config; the runner has none by default.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "dsh-better-sidebar-ci"
          git config --global user.email "ci@dsh.invalid"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Test legacy runtime rejection guards
        run: node --test ci/runtime-legacy/guard.check.mjs scripts/e2e-runtime.check.mjs
      - name: Build
        run: pnpm build
      # The consumer-facing declaration surface guard: a browser-only plugin
      # (no @types/node, skipLibCheck: false) must type-check against the
      # shipped lib/types. Runs AFTER build (it reads the built output).
      - name: Check consumer type surface
        run: pnpm check:consumer-types

  # Pack the plugin as an npm tarball, mount it into a REAL DSH instance
  # through the official `dsh plugin --profile web add` channel, and render
  # the DSH web UI headlessly (Playwright Chromium) to prove the plugin
  # mounts without crashing the shell. Drives `pnpm test:mount`, which boots
  # a keyless `dsh web` against a scratch profile and sweeps every built-in
  # sidebar tab. No API key needed — the whole lane is deterministic.
  plugin-mount:
    name: legacy CLI · locked mount
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI runs must never report to the production telemetry endpoint baked
    # into the DSH composition (same guard DSH's own CI uses).
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_RUNTIME_MODE: legacy
      DSH_MOUNT_ARTIFACTS: mount-artifacts/legacy
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The complete historical host graph is frozen, including Cordis
      # peers. A CLI version alone does not pin its transitive runtime.
      - name: Install complete locked legacy host
        id: legacy
        run: |
          npm ci --prefix ci/runtime-legacy --no-audit --no-fund
          node --expose-internals ci/runtime-legacy/guard.mjs --output mount-artifacts/legacy/host-runtime.json

      # lib/ is gitignored; the tarball is produced from this build.
      - name: Build and pack the npm tarball
        id: package
        run: |
          pnpm build
          pnpm pack
          echo "TARBALL=$PWD/dsh-better-sidebar-$(node -p 'require("./package.json").version').tgz" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        id: browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Mount + headless-render smoke
        run: pnpm test:mount

      # Aggregate double-mount regression: a fixture aggregate bundle mounts
      # dsh-better-sidebar under its own entry id BEFORE the plugin's bundle
      # row; the plugin must back off (no duplicate /sidebar/api, boot OK).
      # Run independently even if the browser mount assertion failed.
      - name: Aggregate double-mount regression
        if: ${{ !cancelled() && steps.legacy.outcome == 'success' && steps.package.outcome == 'success' }}
        run: bash scripts/e2e-aggregate-mount.sh

      - name: Upload mount evidence and Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-mount-evidence
          path: |
            playwright-report/
            test-results/
            mount-artifacts/
          if-no-files-found: ignore
